name: Docker multi-architecture build check

on:
  pull_request:
    branches:
      - master
    paths:
      - 'Dockerfile'
      - 'client/**'
      - 'server/**'
      - 'node-red/**'
      - 'odbc/**'
      - '.github/workflows/docker_multiarch_check.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image for supported architectures (without publishing)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
