<div class="flex-variable-mapping">
    <div class="flex-join">
    </div>
    <div style="display: inline-block;">
        <flex-variable style="display: inline-block"
                       [(value)]="value.from"
                       [data]="data"
                       [placeholders]="placeholders"
                       (valueChange)="onValueChange()"
                       [allowManualEdit]="true"
                       [withStaticValue]="false"
                       [tagTitle]="'gauges.property-tag-internal-title'">
        </flex-variable>
        <mat-icon class="my-form-field-info" style="height: 16px" *ngIf="isNotUsedInView()"
                  matTooltip="{{'gauges.property-map-variable-not-used' | translate}}">error_outline</mat-icon>
        <flex-variable style="display: block"
                       [(value)]="value.to"
                       [data]="data"
                       (valueChange)="onValueChange()"
                       [allowManualEdit]="false"
                       [withStaticValue]="true"
                       [devicesOnly]="true">
        </flex-variable>
    </div>
    <ng-content></ng-content>
</div>
